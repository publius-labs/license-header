# Every `docker run` below carries --user "$(id -u):$(id -g)" (VEL-1358).
#
# These runners are self-hosted and their workspaces persist between jobs. A
# container defaulting to root over a bind-mounted ${{ github.workspace }} leaves
# root-owned files behind — including inside .git, which this workflow then walks
# as the runner user. Git refuses a repository it does not own, reporting first
# "Not a git repository" and then "detected dubious ownership", and the job dies
# at `git diff` with exit 128. Because Verify needs Fix, the header check is then
# skipped: the gate goes quiet precisely when it has something to say.
#
# Observed on dev-2 (2026-08-01) and dev-3 (2026-07-30); the prod runner passed
# the same day because its workspace had not been polluted yet. On GitHub-hosted
# runners the workspace is fresh every time and none of this could happen.

name: License Check

on:
  workflow_call:

permissions:
  contents: write

jobs:
  license-fix:
    name: Fix License Headers
    runs-on: self-hosted
    steps:
      - name: Checkout calling repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Checkout license config
        uses: actions/checkout@v4
        with:
          repository: publius-labs/license-header
          path: .license-common

      - name: Apply common license config
        run: |
          cp .license-common/.licenserc.yaml .licenserc.yaml
          rm -rf .license-common

      # Repairs a workspace an EARLIER run of this workflow already rooted.
      # actions/checkout marks the directory safe too, but under a HOME it
      # overrides and then restores, so the exemption dies with the checkout
      # step and none of the git commands below inherit it. Without this, a
      # runner that is already dirty keeps failing no matter what --user does
      # from now on — the .git it has today is still owned by root.
      - name: Allow git to use this workspace
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Merge repo-specific ignores
        if: hashFiles('.licenserc.repo.yaml') != ''
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}:/workdir" -w /workdir \
            mikefarah/yq:latest \
            '.header."paths-ignore" += load(".licenserc.repo.yaml").header."paths-ignore"' \
            .licenserc.yaml > .licenserc.merged.yaml
          mv .licenserc.merged.yaml .licenserc.yaml

      - name: Fix license headers
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}:/github/workspace" \
            -w /github/workspace \
            apache/skywalking-eyes:latest \
            header fix 2>&1 | grep -v "unsupported file" || true

      # No [skip ci] in the message (VEL-2529): a squash merge copies commit
      # titles onto main and the token would suppress the deploy. The push uses
      # GITHUB_TOKEN, which never starts new workflow runs, so no loop either.
      - name: Commit and push if changes
        run: |
          git diff --exit-code && exit 0
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -m "chore: update license headers"
          git push

  license-check:
    name: Verify License Headers
    runs-on: self-hosted
    needs: license-fix
    steps:
      - name: Checkout calling repo
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}

      - name: Checkout license config
        uses: actions/checkout@v4
        with:
          repository: publius-labs/license-header
          path: .license-common

      - name: Apply common license config
        run: |
          cp .license-common/.licenserc.yaml .licenserc.yaml
          rm -rf .license-common

      - name: Merge repo-specific ignores
        if: hashFiles('.licenserc.repo.yaml') != ''
        run: |
          docker run --rm --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}:/workdir" -w /workdir \
            mikefarah/yq:latest \
            '.header."paths-ignore" += load(".licenserc.repo.yaml").header."paths-ignore"' \
            .licenserc.yaml > .licenserc.merged.yaml
          mv .licenserc.merged.yaml .licenserc.yaml

      - name: Check license headers
        run: |
          set +e
          OUTPUT=$(docker run --rm --user "$(id -u):$(id -g)" \
            -v "${{ github.workspace }}:/github/workspace" \
            -w /github/workspace \
            apache/skywalking-eyes:latest \
            header check 2>&1)
          set -e
          INVALID_COUNT=$(echo "$OUTPUT" | grep -oE 'invalid: [0-9]+' | grep -oE '[0-9]+' | head -1 || echo "0")
          echo "$OUTPUT" | grep -v "unsupported file" || true
          if [ "$INVALID_COUNT" -gt 0 ]; then
            echo "ERROR: Found $INVALID_COUNT files with missing license headers"
            exit 1
          fi
          echo "All supported files have valid license headers"
